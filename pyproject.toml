[project]
name = "triage-agent"
version = "0.1.0"
description = "LangChain + LangGraph triage agent for customer-support tickets"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
observability = [
    "langsmith>=0.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["triage_agent*"]
