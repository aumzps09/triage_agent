services:
  triage-agent:
    build: .
    image: triage-agent
    env_file:
      - path: .env
        required: false
    # No ports/DB — console app only. No key → degraded fallback (escalate all);
    # set a provider key in .env (see .env.example) to enable the LLM path.

  api:
    build: .
    image: triage-agent
    # Single entrypoint (same .env loading + host/port flags as `python app.py`).
    command: ["python", "app.py"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
